# =============================================================================
# ShopNow — Docker Compose (Node.js Microservices)
# =============================================================================
# Mỗi service Node.js chạy độc lập, giao tiếp qua Docker DNS.
# Keycloak + PostgreSQL + MySQL giữ nguyên từ bản Java.
# =============================================================================

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    image: postgres:latest
    platform: linux/amd64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./product-data.sql:/docker-entrypoint-initdb.d/product-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql:5.7
    platform: linux/amd64
    volumes:
      - mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:23.0.3
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: keycloak-mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realms/:/opt/keycloak/data/import/

  # ===========================================================================
  # Business Services (Node.js)
  # ===========================================================================

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: product-service:latest
    ports:
      - "5861:5861"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "5861"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: admin
    restart: unless-stopped

  shopping-cart-service:
    build:
      context: ./shopping-cart-service
      dockerfile: Dockerfile
    image: shopping-cart-service:latest
    ports:
      - "5863:5863"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      PORT: "5863"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: admin
      PRODUCT_SERVICE_URL: http://product-service:5861
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: user-service:latest
    ports:
      - "5865:5865"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      PORT: "5865"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: admin
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/java-microservice-realm/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: spring-cloud-client
      KEYCLOAK_CLIENT_SECRET: AJufwN1eof8P5Gga5Y9atCFqdMuZEuKd
      KEYCLOAK_GRANT_TYPE: client_credentials
      KEYCLOAK_SCOPE: openid offline_access
      CART_SERVICE_URL: http://shopping-cart-service:5863
    restart: unless-stopped

  # ===========================================================================
  # API Gateway (Node.js) — Entry point
  # ===========================================================================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    ports:
      - "5860:5860"
    depends_on:
      - keycloak
      - product-service
      - shopping-cart-service
      - user-service
    environment:
      PORT: "5860"
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/java-microservice-realm
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/java-microservice-realm/protocol/openid-connect/certs
      PRODUCT_SERVICE_URL: http://product-service:5861
      CART_SERVICE_URL: http://shopping-cart-service:5863
      USER_SERVICE_URL: http://user-service:5865
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_keycloak_data:
