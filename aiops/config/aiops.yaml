# Cấu hình AIOps cho ShopNow. Biến môi trường ghi đè: PROMETHEUS_URL, LOKI_URL, ALERTMANAGER_URL, AIOPS_NAMESPACE…
namespace: shopnow
step_seconds: 30
services:
  - api-gateway
  - identity
  - user-profile
  - seller
  - catalog
  - search
  - inventory
  - cart
  - promotion
  - order
  - payment
  - shipping
  - review
  - notification
  - ai-service
  - accounting
  - warehouse
  - web

# Đồ thị gọi tĩnh (fallback khi chưa có service graph từ Tempo/OTel). caller → callee.
# sync = HTTP đồng bộ; async = qua Kafka (producer → consumer), trọng số lan truyền thấp hơn.
graph:
  sync:
    api-gateway: [identity, user-profile, seller, catalog, search, inventory, cart, promotion, order, payment,
                  shipping, review, notification, ai-service, accounting, warehouse]
    web: [api-gateway]                # trình duyệt → gateway (RUM: lcp, jserr)
    payment: [accounting]             # /internal/payouts/paid
    order: [catalog, shipping, promotion, user-profile, seller]
    cart: [catalog, inventory]
    catalog: [seller]
  async:
    order: [inventory, payment, shipping, promotion, cart, review, notification, ai-service, accounting, warehouse]
    warehouse: [accounting]
    inventory: [order, search]
    payment: [order, notification, accounting]
    shipping: [order, notification]
    catalog: [search, inventory, ai-service]
    identity: [user-profile, notification]
    seller: [identity, catalog, notification]
    review: [catalog, search, notification]
  async_weight: 0.3

# PromQL theo service; {window} = cửa sổ rate. Nhãn service phải có trên metric (prom-client defaultLabels,
# hoặc relabel từ nhãn pod app.kubernetes.io/name ở scrape config).
features:
  p95: histogram_quantile(0.95, sum by (service, le) (rate(http_server_requests_seconds_bucket[{window}])))
  err: >-
    sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[{window}]))
    / clamp_min(sum by (service) (rate(http_server_requests_seconds_count[{window}])), 1e-9)
  rps: sum by (service) (rate(http_server_requests_seconds_count[{window}]))
  cpu: sum by (service) (rate(process_cpu_seconds_total[{window}]))
  mem: sum by (service) (process_resident_memory_bytes) / 1048576
  dlq: sum by (service) (rate(kafka_messages_consumed_total{result="dlq"}[{window}]))
  # RUM từ trình duyệt (gateway /api/rum) — gán cho service "web": LCP p75 (giây) và lỗi JS/giây
  lcp: >-
    label_replace(histogram_quantile(0.75, sum by (le) (rate(web_vitals_seconds_bucket{name="LCP"}[{window}]))),
    "service", "web", "", "")
  jserr: label_replace(sum(rate(web_errors_total[{window}])), "service", "web", "", "")
  # KPI bảo mật: đăng nhập thất bại/giây (identity auth_logins_total, nhãn chỉ là loại kết quả)
  auth_fail: label_replace(sum(rate(auth_logins_total{result!="success"}[{window}])), "service", "identity", "", "")
  # KPI kinh doanh: đơn tạo/giây (giảm là xấu), tỉ lệ thanh toán lỗi (tăng là xấu)
  orders: label_replace(sum(rate(orders_created_total[{window}])), "service", "order", "", "")
  pay_fail: >-
    label_replace(sum(rate(payments_total{result="failed"}[{window}]))
    / clamp_min(sum(rate(payments_total{result=~"succeeded|failed"}[{window}])), 1e-9), "service", "payment", "", "")

# KPI có hướng — detection/kpi.py chấm robust z theo chiều xấu, gộp vào điểm bất thường của service
kpis:
  identity:
    auth_fail: {direction: up, min_level: 0.5}   # đăng nhập thất bại/giây — dò mật khẩu, credential stuffing
  web:
    lcp: {direction: up, min_level: 2.5}     # chỉ tính khi LCP p75 vượt ngưỡng "good"
    jserr: {direction: up}
  order:
    orders: {direction: down}
  payment:
    pay_fail: {direction: up, min_level: 0.02}
rate_window: 1m

detection:
  history_minutes: 120        # cửa sổ lấy từ Prometheus mỗi vòng
  train_exclude_minutes: 10   # không huấn luyện IsolationForest trên 10 phút gần nhất
  refit_minutes: 15
  z_window: 60                # điểm (30 phút) cho median/MAD trượt
  z_threshold: 4.5
  score_threshold: 0.6        # ngưỡng điểm [0..1] để coi là bất thường
  persistence: 2              # số bước liên tiếp vượt ngưỡng mới cảnh báo
  log_weight: 0.8
static_thresholds:            # baseline so sánh (giống PrometheusRule thông thường)
  err: 0.05
  p95: 1.0

logs:
  enabled: true
  selector: '{namespace="shopnow"}'
  service_label: service      # nhãn stream Loki chứa tên service (fallback: app, container)
  error_regex: '(?i)(error|exception|fatal|panic|fail|timeout|refused)'
  window_minutes: 2
  limit: 5000

rca:
  top_k: 3
  alpha: 0.85
  anomaly_floor: 0.3
  backward_weight: 0.1

alerting:
  alertname: AIOpsAnomaly
  resolve_after_minutes: 5

agent:
  deploy_lookback_minutes: 30
  investigator: {max_steps: 8, price_per_mtok: 3.0}
  # gom alert của service liền kề (cạnh gọi đồng bộ) vào sự cố đang mở trong cửa sổ — giảm bão cảnh báo
  correlation: {enabled: true, window_minutes: 10}
  # SafetyInterlock: giới hạn cứng trong code, không phụ thuộc prompt
  interlock:
    allow: [rollback, scale_up, restart, toggle_flag, notify]
    max_replicas: 20
    freeze_hours_utc: []          # vd [[13, 15]] = 20h-22h giờ VN (cao điểm flash sale)
    protected: [payment]          # không tự đề xuất rollback/restart
  gitops:
    repo: Luo-Zhii/shop-gitops
    base: main
    env: dev
  dedup_minutes: 30
  approval_ttl_minutes: 120

# Chính sách error budget (Google SRE) cho /change-risk: SLO Sloth → service bị ràng buộc.
error_budget:
  slos:
    gateway-availability: [api-gateway]
    checkout-latency: [order, payment, inventory, cart, api-gateway]
    order-saga-success: [order, payment, inventory]
    web-lcp-good: [web, api-gateway]
    catalog-availability: [catalog]
    search-availability: [search]
    identity-availability: [identity]
    accounting-availability: [accounting]
    warehouse-availability: [warehouse]
    promotion-availability: [promotion]
    review-availability: [review]
    seller-availability: [seller]
    shipping-availability: [shipping]
    user-profile-availability: [user-profile]
    notification-availability: [notification]
    ai-service-availability: [ai-service]

# Dự báo dung lượng (GET /capacity/forecast) — rps_per_pod khớp keda.rpsPerPod của chart
# Trang trạng thái công khai (statuspage.py): nhóm chức năng khách nhìn thấy ← service nội bộ (không lộ tên service)
status_page:
  components:
    - {id: browse, name: "Duyệt & tìm kiếm sản phẩm", services: [web, api-gateway, catalog, search, review, ai-service]}
    - {id: cart, name: "Giỏ hàng & khuyến mãi", services: [cart, promotion, inventory]}
    - {id: checkout, name: "Đặt hàng & thanh toán", services: [order, payment]}
    - {id: delivery, name: "Giao hàng & kho", services: [shipping, warehouse]}
    - {id: account, name: "Tài khoản & thông báo", services: [identity, user-profile, notification]}
    - {id: seller, name: "Kênh người bán", services: [seller, accounting]}
  # Cam kết SLA với người bán (hợp đồng): uptime tháng < ngưỡng → hoàn % phí hoa hồng (bậc thấp nhất mà uptime nằm dưới)
  sla:
    checkout: {target: 0.995, credits: [[0.995, 0.10], [0.99, 0.25], [0.95, 0.50]]}
    seller: {target: 0.99, credits: [[0.99, 0.05], [0.95, 0.15]]}

# Right-sizing (rightsizing.py): đơn giá giống OpenCost mặc định (on-prem: chi phí khấu hao quy đổi), cần ≥ 3 ngày dữ liệu
finops:
  min_days: 3
  price: {cpu_core_hour: 0.031611, ram_gib_hour: 0.004237}

# Quy sự cố ra tiền (agent/impact.py): giá trị đơn TB dự phòng khi chưa có order_gmv_vnd_total 7 ngày
business:
  default_aov_vnd: 350000

# Đóng băng thay đổi quanh flash sale: deploy chạm service trên đường mua hàng (mặc định = capacity.event_services)
# trong [bắt đầu − before, kết thúc + after] → /change-risk ép mức high + duyệt tay; `emergency: true` để bỏ qua (có audit).
change_freeze:
  enabled: true
  before_minutes: 120
  after_minutes: 60

capacity:
  step_seconds: 900
  lookback_days: 15             # ≥ 14 ngày → khử mùa vụ tuần (cuối tuần) trước Holt-Winters ngày
  headroom: 0.3
  default_rps_per_pod: 50
  # flash sale đã lên lịch (promotion) nhân hệ số tăng tải vào dự báo của các service trên đường mua hàng;
  # hệ số học từ các sale đã qua (rps trong sale / cùng giờ hôm trước), chưa có lịch sử → mặc định
  default_event_uplift: 2.0
  event_services: [api-gateway, catalog, search, cart, promotion, order, inventory, payment]
  services:
    api-gateway: {rps_per_pod: 150, min: 2, max: 12}   # khớp keda.rpsPerPod của chart
    catalog: {rps_per_pod: 100, min: 2, max: 10}
    search: {rps_per_pod: 80, min: 2, max: 10}
    order: {rps_per_pod: 40, min: 2, max: 8}
